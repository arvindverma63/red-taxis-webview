<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Red Taxis Driver</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>
    (function() {
      var urlParams = new URLSearchParams(window.location.search);
      var theme = urlParams.get('theme');
      var fontScale = urlParams.get('fontScale') || urlParams.get('scale');
      if (window.location.hash.includes('?')) {
        var queryString = window.location.hash.split('?')[1];
        var hashParams = new URLSearchParams(queryString);
        if (!theme) theme = hashParams.get('theme');
        if (!fontScale) fontScale = hashParams.get('fontScale') || hashParams.get('scale');
      }
      if (!theme) {
        theme = localStorage.getItem('theme');
      }
      if (theme === 'dark') {
        document.documentElement.classList.add('dark-theme');
      } else {
        document.documentElement.classList.remove('dark-theme');
      }
      if (theme) {
        localStorage.setItem('theme', theme);
      }

      if (!fontScale) {
        fontScale = localStorage.getItem('font_scale');
      }
      if (fontScale) {
        var numScale = parseFloat(fontScale);
        if (!isNaN(numScale) && numScale > 0) {
          document.documentElement.style.setProperty('--font-scale', numScale.toString());
          if (document.body) {
            document.body.style.zoom = numScale;
          } else {
            document.addEventListener('DOMContentLoaded', function() {
              document.body.style.zoom = numScale;
            });
          }
          localStorage.setItem('font_scale', numScale.toString());
        }
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
