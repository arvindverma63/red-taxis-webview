<div class="login-container">
  <div class="card login-card">
    <div class="brand-logo">
      <span class="material-symbols-outlined">local_taxi</span>
    </div>
    <h2>Passenger Portal</h2>
    <p>Sign in to access your bookings and live tracking.</p>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" [(ngModel)]="email" placeholder="customer@example.com" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="••••••••" />
    </div>

    <button class="btn btn-primary btn-block" (click)="login()">Sign In</button>
  </div>
</div>
